<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="224" fill="#EFF6FF"/>
  
  <!-- 麦克风主体 -->
  <rect x="440" y="220" width="144" height="240" rx="72" fill="#3B82F6"/>
  
  <!-- 麦克风支架弧线 -->
  <path d="M380,500 Q380,620 512,620 Q644,620 644,500" fill="none" stroke="#3B82F6" stroke-width="20" stroke-linecap="round"/>
  <line x1="512" y1="620" x2="512" y2="700" stroke="#3B82F6" stroke-width="20" stroke-linecap="round"/>
  
  <!-- 声波变成字幕：从弧线自然过渡到横线 -->
  <!-- 左声波 -->
  <path d="M400,340 Q340,340 340,400" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linecap="round"/>
  <path d="M360,300 Q280,300 280,400" fill="none" stroke="#BFDBFE" stroke-width="14" stroke-linecap="round"/>
  <!-- 右声波 -->
  <path d="M624,340 Q684,340 684,400" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linecap="round"/>
  <path d="M664,300 Q744,300 744,400" fill="none" stroke="#BFDBFE" stroke-width="14" stroke-linecap="round"/>
  
  <!-- 底部字幕条：和声波同色系，视觉上是声波的延伸 -->
  <rect x="180" y="760" width="664" height="72" rx="16" fill="#3B82F6" fill-opacity="0.15"/>
  <rect x="220" y="778" width="280" height="14" rx="7" fill="#3B82F6" fill-opacity="0.6"/>
  <rect x="220" y="802" width="180" height="10" rx="5" fill="#3B82F6" fill-opacity="0.35"/>
</svg>
