name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Select Xcode 16.4
      run: sudo xcode-select -s /Applications/Xcode_16.4.app
      
    - name: Build Release
      run: swift build -c release
      
    - name: Create App Bundle
      run: |
        mkdir -p LingoClass.app/Contents/MacOS
        mkdir -p LingoClass.app/Contents/Resources
        cp .build/release/ClassroomTranslator LingoClass.app/Contents/MacOS/LingoClass
        if [ -d ClassroomTranslator/Resources ]; then
          cp -R ClassroomTranslator/Resources/*.lproj LingoClass.app/Contents/Resources/
        fi
        if [ -f ClassroomTranslator/Resources/AppIcon.png ]; then
          mkdir -p LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_256x256@2x.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_64x64@2x.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_32x32@2x.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_16x16@2x.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_16x16.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_32x32.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_128x128.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_256x256.png
          cp ClassroomTranslator/Resources/AppIcon.png LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png
          python3 -c "import json,os;os.makedirs('LingoClass.app/Contents/Resources/Assets.xcassets',exist_ok=True);imgs=[{'idiom':'mac','filename':f,'scale':s,'size':sz} for f,sz,s in [('icon_16x16.png','16x16','1x'),('icon_16x16@2x.png','16x16','2x'),('icon_32x32.png','32x32','1x'),('icon_32x32@2x.png','32x32','2x'),('icon_128x128.png','128x128','1x'),('icon_128x128@2x.png','128x128','2x'),('icon_256x256.png','256x256','1x'),('icon_256x256@2x.png','256x256','2x'),('icon_512x512.png','512x512','1x'),('icon_512x512@2x.png','512x512','2x')]];open('LingoClass.app/Contents/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json','w').write(json.dumps({'images':imgs,'info':{'author':'xcode','version':1}}));open('LingoClass.app/Contents/Resources/Assets.xcassets/Contents.json','w').write(json.dumps({'info':{'author':'xcode','version':1}}))"
        fi
        
    - name: Create Info.plist
      run: |
        python3 -c "
        plist = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
        <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
        <plist version=\"1.0\">
        <dict>
            <key>CFBundleName</key><string>LingoClass</string>
            <key>CFBundleDisplayName</key><string>LingoClass</string>
            <key>CFBundleIdentifier</key><string>com.user.lingoclass</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>LingoClass</string>
            <key>CFBundleIconName</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleLocalizations</key><array><string>en</string><string>zh-Hans</string></array>
            <key>NSMicrophoneUsageDescription</key><string>This app needs microphone access to recognize speech.</string>
            <key>NSSpeechRecognitionUsageDescription</key><string>This app uses speech recognition to transcribe lectures.</string>
        </dict>
        </plist>'''
        with open('LingoClass.app/Contents/Info.plist','w') as f:
            f.write(plist.strip())
        "
        
    - name: Ad-hoc Sign App Bundle
      run: |
        chmod +x LingoClass.app/Contents/MacOS/LingoClass
        codesign --force --deep --sign - LingoClass.app
        codesign --verify --deep --strict LingoClass.app
        codesign -dv LingoClass.app
        
    - name: Create DMG
      run: hdiutil create -volname "LingoClass" -srcfolder LingoClass.app -ov -format UDZO LingoClass.dmg
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoClass-macOS
        path: LingoClass.dmg
        retention-days: 30
