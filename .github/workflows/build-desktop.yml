name: Build Desktop Package

on:
  push:
    branches: [ main, master, codex/shared-macos-package ]
    paths:
      - 'Tools/transcription-mvp/**'
      - 'Desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Python 3.12)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Tools/transcription-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt keyring requests cryptography
      - name: Run tests
        run: python -m unittest test_caption_text test_live_caption_pipeline test_live_language test_classroom_summary test_classroom_revision
      - name: Verify the sealed credential document opens
        env:
          LINGOCLASS_ALLOW_DEBUG: '1'
        run: |
          python -c "import secrets_store; keys=secrets_store.load(allow_remote=False); print('providers:', sorted(keys))"
      - name: Verify no plaintext key is committed
        shell: bash
        run: |
          if grep -rqE 'sk-[A-Za-z0-9]{24,}' --include='*.json' --include='*.py' --include='*.ps1' --include='*.sh' . ; then
            echo 'A plaintext API key is committed to the repository.'
            exit 1
          fi
          echo 'No plaintext API key found.'

  package:
    name: Build macOS .pkg (Apple Silicon)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend
        run: |
          cd Desktop
          npm ci
          npm run build
      - name: Prepare bundled models
        run: |
          python3 -m pip install requests
          python3 Tools/transcription-mvp/download_models.py --model small
          python3 Tools/transcription-mvp/download_models.py --model tiny
          python3 Tools/transcription-mvp/download_grammar.py
          python3 Packaging/restore_models.py
      - name: Build and sign the desktop package
        run: bash Tools/transcription-mvp/build-macos.sh
      - name: Verify the package holds no plaintext credential
        run: |
          if grep -rqE 'sk-[A-Za-z0-9]{24,}' Releases/macOS/LingoClass.app/Contents/MacOS --include='*.json' --include='*.py' 2>/dev/null; then
            echo 'A plaintext API key was packaged into LingoClass.app'
            exit 1
          fi
          echo 'LingoClass.app carries only the sealed credential document.'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoClass-macOS-pkg
          path: Releases/macOS/LingoClass-Setup.pkg
          retention-days: 30
