<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LingoClass 转写实验台</title>
<style>body{margin:0;background:#f3f5fa;color:#18243a;font:15px system-ui}main{max-width:1120px;margin:28px auto;padding:0 24px}h1{font-size:28px;margin-bottom:6px}.muted{color:#64748b}.card{background:white;border:1px solid #dce3ee;border-radius:16px;padding:20px;margin:16px 0}label{display:inline-flex;flex-direction:column;gap:6px;margin:0 16px 12px 0}select,input,button{font:inherit;padding:9px;border:1px solid #ccd5e3;border-radius:8px}button{cursor:pointer;background:#2463eb;color:white;margin-right:8px}button:disabled{opacity:.45;cursor:default}input[type=number]{width:85px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.columns .card{margin:0}#rows,#live{min-height:180px;max-height:430px;overflow:auto;white-space:pre-wrap;line-height:1.8}.row{padding:10px 0;border-bottom:1px solid #edf1f7}.stable{color:#865500}.unstable{color:#8590a4}#log{white-space:pre-wrap;font:12px monospace;max-height:200px;overflow:auto}#error{color:#b42318}#status{font-weight:600}summary{cursor:pointer;margin:12px 0}#metrics{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;margin-top:12px}@media(max-width:700px){.columns{grid-template-columns:1fr}} </style>
<main><h1>LingoClass · 转写实验台</h1><div class="muted">Whisper ONNX · 英文实时转写 · 自动语法校对 · Qwen 流式翻译</div>
<div class="card"><label>Whisper 模型<select id="model"><option>small</option><option>tiny</option><option>base</option></select></label><label>输入设备<select id="device"></select></label>
<div><button id="start">开始录音</button><button id="stop" disabled>停止并保存</button><button id="export">导出日志 JSON</button><button id="txt">导出英文</button></div>
<div style="margin-top:14px"><label>或回放 PCM WAV<input id="file" type="file" accept=".wav"></label><button id="replay">按原速回放测试</button></div>
<details><summary>转写参数</summary><label>VAD 阈值<input id="vad_threshold" type="number" value="0.5" min="0.1" max="0.9" step="0.05"></label><label>静音收尾（秒）<input id="silence" type="number" value="0.7" min="0.3" max="2" step="0.1"></label><label>后续解码间隔（秒）<input id="partial_interval" type="number" value="1.5" min="1" max="5" step="0.5"></label><label>最低 RMS<input id="minimum_rms" type="number" value="0.004" min="0" max="0.1" step="0.001"></label><label>CPU 线程<input id="threads" type="number" value="4" min="1" max="8"></label></details>
<details><summary>Qwen 翻译设置</summary><div class="muted">开启后将英文发送到阿里云，按 API 用量计费。Key 仅保留在本次运行内存中。</div><label>API Key<input id="qwenKey" type="password" autocomplete="off"></label><label>官方接口地址<input id="qwenEndpoint" value="https://maas.qianwenaiapi.com/compatible-mode/v1" style="width:430px"></label><button id="qwenSave">启用翻译</button><span id="qwenStatus"></span></details><div id="status">准备就绪</div><div id="error"></div><div id="metrics"></div></div>
<div class="columns"><div class="card"><h3>已稳定句子 / 已定稿段落</h3><div class="muted">完整句子及时进入这里，后续允许修订和追加。</div><div id="rows"></div></div><div class="card"><h3>实时假设</h3><div class="muted">黄色为稳定前缀，[…] 后的灰色为未稳定内容。</div><div id="live"></div></div></div>
<div class="card"><h3>英文语法校对（实验）</h3><div class="muted">实时字幕先做快速标点校对，检测到明确语法异常时才运行 T5；停止后可完整校对。原始转写始终保留。无法保证所有修正都符合原意。</div><button id="grammar">校对已定稿英文</button><div id="grammarStatus"></div><div id="grammarResult" style="white-space:pre-wrap;line-height:1.8"></div></div><div class="card"><h3>采集与解码日志</h3><div id="directory" class="muted"></div><div id="log"></div></div></main>
<script>const token='__TOKEN__'; const $=id=>document.getElementById(id);let state=null,busy=false,lastRows='',lastLive=''; const phaseNames={idle:'准备就绪',loading:'正在加载模型…',recording:'录音 / 回放中',stopping:'正在收尾，请等待解码完成…',done:'已停止并保存',error:'录音或解码失败，已有内容已保留'};
function config(){let v={model:$('model').value,device:$('device').value===''?null:Number($('device').value)};for(let id of ['vad_threshold','silence','partial_interval','minimum_rms','threads'])v[id]=Number($(id).value);return v}
async function post(path,body,extra={}){let r=await fetch(path,{method:'POST',headers:{'X-Lingo-Token':token,...extra},body});let x=await r.json();if(!r.ok)throw Error(x.error);return x}
async function action(fn){if(busy)return;busy=true;$('error').textContent='';try{await fn();await poll()}catch(e){$('error').textContent=e.message}finally{busy=false}}
$('qwenSave').onclick=async()=>{try{let x=await post('/api/translation-settings',JSON.stringify({key:$('qwenKey').value,endpoint:$('qwenEndpoint').value}));$('qwenKey').value='';$('qwenStatus').textContent=x.configured?'已启用':'尚未配置 Key';}catch(e){$('qwenStatus').textContent=e.message}};
$('grammar').onclick=async()=>{ $('grammar').disabled=true; $('grammarStatus').textContent='正在进行本地语法校对…'; try{let x=await post('/api/grammar','{}');$('grammarResult').replaceChildren(...x.rows.map(r=>{let d=document.createElement('div');d.className='row';d.textContent='原文：'+r.original+'\n建议：'+r.corrected+(r.status==='rejected'?'（改动过大，已保留原文）':r.status==='too_long'?'（段落过长，已保留原文）':'');return d}));$('grammarStatus').textContent='校对完成，原始识别内容未被修改';}catch(e){$('grammarStatus').textContent=e.message}finally{$('grammar').disabled=false}};
$('start').onclick=()=>action(()=>post('/api/start',JSON.stringify(config())));$('stop').onclick=()=>action(()=>post('/api/stop','{}'));
$('replay').onclick=()=>action(async()=>{let f=$('file').files[0];if(!f)throw Error('请先选择 PCM WAV 文件');await post('/api/file',await f.arrayBuffer(),{'X-Lingo-Config':JSON.stringify(config())})});
function download(data,name,type){let url=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=async()=>{let x=await(await fetch('/api/export')).json();download(JSON.stringify(x,null,2),'lingoclass-asr-log.json','application/json')};$('txt').onclick=()=>{if(!state)return;download(state.transcript||'','lingoclass-transcript.txt','text/plain')};
async function poll(){try{state=await(await fetch('/api/state')).json();let active=['loading','recording','stopping'].includes(state.phase);$('start').disabled=active;$('replay').disabled=active;$('stop').disabled=!['loading','recording'].includes(state.phase);$('model').disabled=active;$('device').disabled=active;$('status').textContent=(phaseNames[state.phase]||state.phase)+(state.metrics.stage==='boundary'?' · 正在校对分界':'');
let rowSignature=JSON.stringify([state.rows,state.language_rows]);if(rowSignature!==lastRows){let follow=$('rows').scrollHeight-$('rows').scrollTop-$('rows').clientHeight<80;let scroll=$('rows').scrollTop;$('rows').replaceChildren(...state.rows.filter(r=>!Object.values(state.language_rows||{}).some(p=>p.members?.includes(r.id)&&p.id!==r.id)).map(r=>{let d=document.createElement('div');d.className='row';let p=state.language_rows?.[r.id];d.textContent=(p?.english||r.text)+(p?.english&&p.english!==(p.original||r.text)?'\n识别原文：'+(p.original||r.text):'')+'\n'+(p?.chinese||'')+(p?.translation_stale?'（上一版翻译，正在修订）':'')+(p?.status==='grammar'?'（语法校对中）':p?.status==='queued'?'（等待校对）':p?.status==='translating'?'（翻译中）':p?.status==='error'?'（'+p.error+'）':'');return d}));$('rows').scrollTop=follow?$('rows').scrollHeight:scroll;lastRows=rowSignature}let liveSignature=JSON.stringify(state.live);if(liveSignature!==lastLive){$('live').replaceChildren(...state.live.map(r=>{let d=document.createElement('div');let s=document.createElement('span');s.className='stable';s.textContent=r.stable+' ';let u=document.createElement('span');u.className='unstable';u.textContent=r.unstable?'[…] '+r.unstable:'';d.append(s,u);return d}));lastLive=liveSignature}
let m=state.metrics;let usage=state.translation_usage||{};$('metrics').textContent=`电平 ${m.rms.toFixed(4)} · 语音 ${m.speech?'是':'否'} · 已采集 ${m.captured_seconds.toFixed(1)}s · 解码 ${m.decode_seconds.toFixed(2)}s · RTF ${m.rtf.toFixed(2)} · 待定稿 ${m.pending_finals} · 丢块 ${m.dropped_blocks} · 翻译请求 ${usage.requests||0} · 复用 ${usage.cache_hits||0} · 输入/输出 tokens ${usage.prompt_tokens||0}/${usage.completion_tokens||0}`;$('directory').textContent=state.session_dir?'记录目录：'+state.session_dir:'';$('log').textContent=state.logs.map(x=>`${x.time.slice(11)} ${x.event} ${JSON.stringify(x)}`).join('\n');$('log').scrollTop=$('log').scrollHeight;
if(state.error)$('error').textContent=state.error;
}catch(e){$('status').textContent='无法连接本机实验台：'+e.message}}
(async()=>{let x=await(await fetch('/api/config')).json();$('model').replaceChildren(...x.models.map(m=>{let o=document.createElement('option');o.value=m.name;o.textContent=m.name+(m.name==='small.en'?'（英语专用，实验）':'')+(m.ready?' · 已下载':' · 未下载');o.disabled=!m.ready;return o}));$('model').value=x.models.find(m=>m.name==='small'&&m.ready)?.name||x.models.find(m=>m.ready)?.name||'small';$('device').replaceChildren(...x.devices.map(d=>{let o=document.createElement('option');o.value=d.id;o.textContent=d.name+(d.default?'（默认）':'');o.selected=d.default;return o}));await poll();setInterval(poll,300)})().catch(e=>$('error').textContent=e.message);
</script></html>
