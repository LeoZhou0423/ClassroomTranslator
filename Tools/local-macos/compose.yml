services:
  macos:
    image: classroomtranslator-macos-audio:local
    container_name: classroomtranslator-macos
    entrypoint:
      - /bin/sh
      - /shared/ClassroomTranslator/Tools/local-macos/entrypoint-audio.sh
    environment:
      VERSION: "26"
      CONNECTIONS: "4"
      RAM_SIZE: "12G"
      CPU_CORES: "8"
      DISK_SIZE: "160G"
      # Software-rendered macOS is much more responsive at a smaller desktop.
      WIDTH: "1280"
      HEIGHT: "720"
      # Reduce bandwidth and browser decoding work for the noVNC session.
      LOSSY: "Y"
      # QEMU 音频：Intel HDA 麦克风声卡（macOS 侧由 VoodooHDA-Tahoe 驱动）。
      # ALSA 从 PulseAudio 的稳定 monitor source 采集；Windows 麦克风通过
      # docker exec -i 写入对应 null sink（audio-setup.sh 配置）。
      ARGUMENTS: "-device intel-hda -device hda-micro,audiodev=audio0 -audiodev alsa,id=audio0,in.dev=mic_capture,in.fixed-settings=on,in.frequency=48000,in.channels=1,in.format=s16,in.buffer-length=100000,out.dev=null"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    extra_hosts:
      # The local split-DNS route resolves Apple CDN to a domestic node that
      # closes range downloads early. Pin this container to an Akamai edge.
      - "oscdn.apple.com:23.211.177.104"
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:5900:5900/tcp"
      - "127.0.0.1:5900:5900/udp"
    volumes:
      - classroomtranslator_macos_disk:/storage
      - ../..:/shared/ClassroomTranslator
    restart: unless-stopped
    stop_grace_period: 2m

volumes:
  classroomtranslator_macos_disk:
    name: classroomtranslator_macos_disk
