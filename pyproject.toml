[tool.ruff]
target-version = "py312"
line-length = 100
include = ["Tools/transcription-mvp/*.py"]
extend-exclude = ["Artifacts", "Build", "Releases", "models", "sessions", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "B012", "B023", "S110"]

[tool.ruff.lint.per-file-ignores]
# These standalone conversion/probe tools deliberately add the repository to sys.path.
"Tools/transcription-mvp/asr_lab.py" = ["E402"]
"Tools/transcription-mvp/app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

